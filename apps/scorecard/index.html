<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorecard</title>
    <link rel="stylesheet" href="/shared/css/theme.css">
    <link rel="stylesheet" href="/shared/css/app-page.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="/shared/css/nav.css">
</head>

<body>
    <div class="container">
        <h1 class="page-title">Scorecard</h1>

        <div class="settings-container">
            <div class="setting-group">
                <label for="points-per-round" title="Total points expected in a single round. Highlights row if sum doesn't match.">Points per Round (validation):</label>
                <input type="number" id="points-per-round" class="setting-input" placeholder="Optional">
            </div>
            <div class="setting-group">
                <label for="total-points" title="Points required for a player to indicate end game condition.">Total points to end game:</label>
                <input type="number" id="total-points" class="setting-input" placeholder="Optional">
            </div>
        </div>

        <div class="action-buttons">
            <button class="add-row-button action-button">Add Game</button>
            <button class="add-column-button action-button">Add Player</button>
            <button class="reset-game-button action-button danger-button">Reset Game</button>
        </div>

        <div class="table-container">
            <table id="dynamic-table">
                <thead>
                    <tr id="header-row">
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
                <tfoot>
                    <tr id="footer-row">
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="action-buttons">
            <button class="add-row-button action-button">Add Game</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"
        integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
    <script src="index.js"></script>
    <script src="/shared/js/nav.js"></script>
</body>

</html>
